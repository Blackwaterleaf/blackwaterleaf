<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Offline – BlackwaterLeaf</title>
  <meta name="theme-color" content="#0a0f0d" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%;
      background: oklch(0.08 0.008 200);
      color: oklch(0.88 0.005 200);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2rem;
    }
    .container { max-width: 360px; }
    .logo {
      width: 72px;
      height: 72px;
      border-radius: 20px;
      background: oklch(0.14 0.008 200);
      border: 1px solid oklch(0.22 0.008 200);
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 1.5rem;
      font-size: 2.5rem;
    }
    h1 {
      font-family: 'Bebas Neue', 'Impact', sans-serif;
      font-size: 2.2rem;
      letter-spacing: 0.06em;
      color: oklch(0.92 0.005 200);
      margin-bottom: 0.5rem;
    }
    .subtitle {
      font-size: 0.875rem;
      color: oklch(0.52 0.14 148);
      letter-spacing: 0.08em;
      text-transform: uppercase;
      font-weight: 600;
      margin-bottom: 1.5rem;
    }
    p {
      font-size: 0.9375rem;
      color: oklch(0.60 0.008 200);
      line-height: 1.6;
      margin-bottom: 2rem;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.75rem 1.75rem;
      border-radius: 9999px;
      background: oklch(0.52 0.14 148);
      color: oklch(0.07 0.008 240);
      font-weight: 600;
      font-size: 0.9375rem;
      text-decoration: none;
      cursor: pointer;
      border: none;
      transition: opacity 0.15s;
    }
    .btn:hover { opacity: 0.88; }
    .hint {
      margin-top: 1.5rem;
      font-size: 0.8125rem;
      color: oklch(0.40 0.008 200);
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo">🌿</div>
    <div class="subtitle">BlackwaterLeaf</div>
    <h1>OFFLINE</h1>
    <p>
      Du bist gerade nicht mit dem Internet verbunden.<br />
      Überprüfe deine Verbindung und versuche es erneut.
    </p>
    <button class="btn" onclick="window.location.reload()">
      ↻ Erneut versuchen
    </button>
    <p class="hint">Gecachte Seiten sind weiterhin verfügbar.</p>
  </div>
</body>
</html>
